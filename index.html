    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- Firebase Configuration ---
        const firebaseConfig = {
            apiKey: "AIzaSyAKksvupRp0gVLVKpuMORQjxJyxEYCW_0I",
            authDomain: "ku--fondue.firebaseapp.com",
            projectId: "ku--fondue",
            storageBucket: "ku--fondue.firebasestorage.app",
            messagingSenderId: "141584854811",
            appId: "1:141584854811:web:3c8ede7ac051a6f9ecadbe",
            measurementId: "G-4NMQB898S1"
        };

        // Initialize Firebase & Firestore
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const KU_LAT = 13.8478;
        const KU_LNG = 100.5696;
        
        let issues = [];
        let reportMap, dashboardMap;
        let reportMarker;
        let dashboardMarkers = [];
        let currentResolvingIssueId = null;

        const STATUS_UI = {
            'pending': { color: '#f59e0b', text: 'รอรับเรื่อง', bg: 'bg-orange-50 text-orange-700 border-orange-200', icon: 'ph-clock' },
            'progress': { color: '#0ea5e9', text: 'กำลังดำเนินการ', bg: 'bg-sky-50 text-sky-700 border-sky-200', icon: 'ph-wrench' },
            'resolved': { color: '#10b981', text: 'แก้ไขเสร็จสิ้น', bg: 'bg-emerald-50 text-emerald-700 border-emerald-200', icon: 'ph-check-circle' }
        };

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            initMaps();
            initReportImageUpload();
            initResolveImageUpload();
            listenToFirestoreIssues();

            window.addEventListener('resize', debounce(() => {
                if (reportMap) reportMap.invalidateSize();
                if (dashboardMap) dashboardMap.invalidateSize();
            }, 250));
        });

        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => { clearTimeout(timeout); func(...args); };
                clearTimeout(timeout); timeout = setTimeout(later, wait);
            };
        }

        // --- Realtime Sync with Firestore ---
        function listenToFirestoreIssues() {
            db.collection("issues").orderBy("date", "desc")
                .onSnapshot((snapshot) => {
                    issues = [];
                    snapshot.forEach((doc) => {
                        issues.push({ id: doc.id, ...doc.data() });
                    });
                    updateStats();
                    renderDashboard();
                }, (error) => {
                    console.error("Firestore Listener Error:", error);
                    showToast("เกิดข้อผิดพลาดในการเชื่อมต่อ Firestore", "error");
                });
        }

        // --- Image Compression Helper ---
        function compressImage(file, maxWidth = 800, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = (err) => reject(err);
                };
                reader.onerror = (err) => reject(err);
            });
        }

        // --- Tab Navigation ---
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');

            document.querySelectorAll('.desktop-nav-btn').forEach(btn => {
                if (btn.getAttribute('data-tab') === tabName) {
                    btn.className = 'desktop-nav-btn px-5 py-2 rounded-lg text-sm font-bold transition-all bg-white text-ku shadow-sm flex items-center gap-2';
                } else {
                    btn.className = 'desktop-nav-btn px-5 py-2 rounded-lg text-sm font-bold transition-all text-white/80 hover:text-white flex items-center gap-2';
                }
            });

            document.querySelectorAll('.mobile-nav-btn').forEach(btn => {
                if (btn.getAttribute('data-tab') === tabName) {
                    btn.className = 'mobile-nav-btn flex flex-col items-center justify-center w-full h-full text-ku font-medium transition-colors';
                } else {
                    btn.className = 'mobile-nav-btn flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-slate-600 transition-colors';
                }
            });

            setTimeout(() => {
                if (reportMap) reportMap.invalidateSize();
                if (dashboardMap) dashboardMap.invalidateSize();
            }, 100);
        }

        // --- Toast Notifications ---
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            let bgClass = 'bg-slate-800', iconClass = 'ph-info';
            if(type === 'success') { bgClass = 'bg-ku'; iconClass = 'ph-check-circle'; }
            if(type === 'error') { bgClass = 'bg-red-500'; iconClass = 'ph-warning-circle'; }
            if(type === 'progress') { bgClass = 'bg-sky-500'; iconClass = 'ph-wrench'; }

            toast.className = `${bgClass} text-white px-5 py-3.5 rounded-2xl shadow-xl text-sm font-medium flex items-center gap-3 transform transition-all duration-300 translate-y-[-20px] opacity-0`;
            toast.innerHTML = `<i class="ph-fill ${iconClass} text-xl"></i> ${message}`;
            container.appendChild(toast);
            
            setTimeout(() => toast.classList.remove('translate-y-[-20px]', 'opacity-0'), 10);
            setTimeout(() => { toast.classList.add('opacity-0', 'translate-y-[-20px]'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        // --- Maps & GPS ---
        function initMaps() {
            reportMap = L.map('report-map', { zoomControl: false }).setView([KU_LAT, KU_LNG], 16);
            L.control.zoom({ position: 'topleft' }).addTo(reportMap);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap'
            }).addTo(reportMap);

            const markerIcon = L.divIcon({
                className: 'custom-div-icon',
                html: `<div class="custom-marker bg-ku w-10 h-10 border-[3px]"><i class="ph-fill ph-map-pin text-2xl"></i></div>`,
                iconSize: [40, 40], iconAnchor: [20, 40]
            });

            reportMarker = L.marker([KU_LAT, KU_LNG], {draggable: true, icon: markerIcon}).addTo(reportMap);
            reportMarker.on('dragend', (e) => updateCoordsData(e.target.getLatLng().lat, e.target.getLatLng().lng));
            reportMap.on('click', (e) => { reportMarker.setLatLng(e.latlng); updateCoordsData(e.latlng.lat, e.latlng.lng); });

            dashboardMap = L.map('dashboard-map', { zoomControl: false }).setView([KU_LAT, KU_LNG], 15);
            L.control.zoom({ position: 'topleft' }).addTo(dashboardMap);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap'
            }).addTo(dashboardMap);
        }

        function updateCoordsData(lat, lng) {
            document.getElementById('lat').value = lat; document.getElementById('lng').value = lng;
        }

        function getCurrentLocation() {
            const btn = document.getElementById('gps-btn');
            const icon = btn.querySelector('i');
            icon.className = 'loader border-t-ku';
            
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude, lng = position.coords.longitude;
                        reportMap.setView([lat, lng], 17);
                        reportMarker.setLatLng([lat, lng]);
                        updateCoordsData(lat, lng);
                        icon.className = 'ph-bold ph-crosshair text-ku text-xl group-hover:scale-110 transition-transform';
                        showToast('ดึงพิกัดตำแหน่งสำเร็จ', 'success');
                    },
                    (error) => {
                        icon.className = 'ph-bold ph-crosshair text-ku text-xl group-hover:scale-110 transition-transform';
                        showToast('ไม่สามารถเข้าถึงตำแหน่ง GPS ได้', 'error');
                    }, { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                );
            }
        }

        // --- Image Upload Logic ---
        function initReportImageUpload() {
            const input = document.getElementById('image-upload');
            const preview = document.getElementById('image-preview');
            const placeholder = document.getElementById('upload-placeholder');
            const removeBtn = document.getElementById('remove-image-btn');
            const base64Input = document.getElementById('image-base64');

            input.addEventListener('change', async function(e) {
                const file = e.target.files[0];
                if (file) {
                    try {
                        const compressedBase64 = await compressImage(file, 800, 0.7);
                        preview.src = compressedBase64;
                        preview.classList.remove('hidden');
                        placeholder.classList.add('opacity-0'); 
                        removeBtn.classList.remove('hidden');
                        base64Input.value = compressedBase64;
                    } catch (err) {
                        showToast('การประมวลผลรูปภาพล้มเหลว', 'error');
                    }
                }
            });

            removeBtn.addEventListener('click', function(e) {
                e.preventDefault(); e.stopPropagation(); 
                input.value = ''; preview.src = '';
                preview.classList.add('hidden');
                placeholder.classList.remove('opacity-0');
                removeBtn.classList.add('hidden');
                base64Input.value = '';
            });
        }

        function initResolveImageUpload() {
            const resolveInput = document.getElementById('resolve-image-upload');
            resolveInput.addEventListener('change', async function(e) {
                const file = e.target.files[0];
                if (file && currentResolvingIssueId) {
                    showToast('กำลังบันทึกภาพปิดงานไปยัง Firestore...', 'progress');
                    try {
                        const compressedBase64 = await compressImage(file, 800, 0.7);
                        await db.collection("issues").doc(currentResolvingIssueId).update({
                            status: 'resolved',
                            resolveImage: compressedBase64
                        });
                        
                        closeModal();
                        showToast('ปิดงานและอัปเดตข้อมูลขึ้น Firestore เรียบร้อย!', 'success');
                    } catch (err) {
                        console.error("Resolve image update error:", err);
                        showToast('ไม่สามารถอัปเดตสถานะใน Firestore ได้', 'error');
                    }
                    resolveInput.value = '';
                    currentResolvingIssueId = null;
                }
            });
        }

        // --- Form Submission to Firestore ---
        document.getElementById('report-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<div class="loader text-white"></div> <span class="ml-2">กำลังบันทึกลง Cloud...</span>`;
            btn.disabled = true;

            const newIssue = {
                title: document.getElementById('issue-title').value,
                desc: document.getElementById('issue-desc').value,
                lat: parseFloat(document.getElementById('lat').value),
                lng: parseFloat(document.getElementById('lng').value),
                image: document.getElementById('image-base64').value || 'https://placehold.co/600x400/006664/ffffff?text=No+Image',
                resolveImage: null,
                status: 'pending',
                date: new Date().toISOString()
            };

            try {
                await db.collection("issues").add(newIssue);
                this.reset();
                const removeBtn = document.getElementById('remove-image-btn');
                if(!removeBtn.classList.contains('hidden')) removeBtn.click();
                
                showToast('ส่งรายงานเข้า Firestore สำเร็จ!', 'success');
                switchTab('dashboard');
            } catch (err) {
                console.error("Error adding document: ", err);
                showToast('เกิดข้อผิดพลาดในการบันทึกข้อมูล', 'error');
            } finally {
                btn.innerHTML = originalText; btn.disabled = false;
            }
        });

        // --- Dashboard Rendering ---
        function updateStats() {
            let pending = 0, progress = 0, resolved = 0;
            issues.forEach(i => {
                if(i.status === 'pending') pending++;
                if(i.status === 'progress') progress++;
                if(i.status === 'resolved') resolved++;
            });
            document.getElementById('stat-total').innerText = issues.length;
            document.getElementById('stat-pending').innerText = pending;
            document.getElementById('stat-progress').innerText = progress;
            document.getElementById('stat-resolved').innerText = resolved;
        }

        function renderDashboard() {
            const listEl = document.getElementById('issue-list');
            listEl.innerHTML = '';
            
            dashboardMarkers.forEach(m => dashboardMap.removeLayer(m));
            dashboardMarkers = [];

            if(issues.length === 0) {
                listEl.innerHTML = `<div class="text-center py-16 text-slate-500">ไม่มีข้อมูลปัญหาในขณะนี้</div>`;
                return;
            }

            issues.forEach(issue => {
                const ui = STATUS_UI[issue.status] || STATUS_UI['pending'];
                
                const mIcon = L.divIcon({
                    className: 'custom-div-icon',
                    html: `<div class="custom-marker w-7 h-7 shadow-md" style="background-color: ${ui.color}; border-width: 2px;"><i class="ph-fill ${ui.icon} text-sm"></i></div>`,
                    iconSize: [28, 28], iconAnchor: [14, 14]
                });

                const marker = L.marker([issue.lat, issue.lng], { icon: mIcon })
                    .addTo(dashboardMap)
                    .bindPopup(`
                        <div class="p-1 font-sans">
                            <p class="font-bold text-slate-800 text-sm">${issue.title}</p>
                            <p class="text-xs text-slate-500 mt-1">${issue.desc || '-'}</p>
                            <button onclick="openModal('${issue.id}')" class="mt-2 text-xs text-ku font-bold underline cursor-pointer">ดูรายละเอียด</button>
                        </div>
                    `);
                
                dashboardMarkers.push(marker);

                const dateStr = new Date(issue.date).toLocaleDateString('th-TH', {
                    day: 'numeric', month: 'short', year: '2-digit', hour: '2-digit', minute: '2-digit'
                });

                const card = document.createElement('div');
                card.className = 'p-4 rounded-2xl border border-slate-200 bg-white shadow-sm hover:shadow-md transition-all cursor-pointer flex gap-4 items-center group';
                card.onclick = () => openModal(issue.id);
                card.innerHTML = `
                    <img src="${issue.image}" class="w-20 h-20 rounded-xl object-cover flex-none bg-slate-100 border border-slate-100" alt="issue thumbnail" />
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between gap-2 mb-1">
                            <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full border ${ui.bg} flex items-center gap-1">
                                <i class="ph-bold ${ui.icon}"></i> ${ui.text}
                            </span>
                            <span class="text-[11px] text-slate-400">${dateStr}</span>
                        </div>
                        <h4 class="font-bold text-slate-800 truncate text-sm group-hover:text-ku transition-colors">${issue.title}</h4>
                        <p class="text-xs text-slate-500 truncate mt-0.5">${issue.desc || 'ไม่มีรายละเอียดเพิ่มเติม'}</p>
                    </div>
                    <i class="ph-bold ph-caret-right text-slate-300 group-hover:text-ku group-hover:translate-x-0.5 transition-all flex-none"></i>
                `;
                listEl.appendChild(card);
            });
        }

        function focusOnDashboardMap(lat, lng) {
            closeModal();
            switchTab('dashboard');
            setTimeout(() => {
                if (dashboardMap) {
                    dashboardMap.setView([lat, lng], 18);
                    const marker = dashboardMarkers.find(m => {
                        const pos = m.getLatLng();
                        return Math.abs(pos.lat - lat) < 0.0001 && Math.abs(pos.lng - lng) < 0.0001;
                    });
                    if (marker) marker.openPopup();
                }
            }, 250);
        }

        function openModal(id) {
            const issue = issues.find(i => i.id === id);
            if (!issue) return;

            const ui = STATUS_UI[issue.status] || STATUS_UI['pending'];
            const dateStr = new Date(issue.date).toLocaleDateString('th-TH', {
                day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit'
            });

            const modalBody = document.getElementById('modal-body');
            const modalFooter = document.getElementById('modal-footer');

            modalBody.innerHTML = `
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-semibold px-3 py-1 rounded-full border ${ui.bg} flex items-center gap-1.5 inline-flex">
                            <i class="ph-bold ${ui.icon}"></i> ${ui.text}
                        </span>
                        <span class="text-xs text-slate-400 font-medium">${issue.id} • ${dateStr}</span>
                    </div>

                    <h3 class="text-lg font-bold text-slate-800">${issue.title}</h3>
                    
                    <p class="text-sm text-slate-600 bg-slate-50 p-3 rounded-xl border border-slate-100">${issue.desc || 'ไม่มีรายละเอียดเพิ่มเติม'}</p>

                    <div class="grid grid-cols-1 ${issue.resolveImage ? 'sm:grid-cols-2' : ''} gap-3">
                        <div>
                            <span class="block text-xs font-semibold text-slate-500 mb-1">รูปภาพปัญหา:</span>
                            <img src="${issue.image}" class="w-full h-48 object-cover rounded-2xl border border-slate-200" alt="Issue photo" />
                        </div>
                        ${issue.resolveImage ? `
                        <div>
                            <span class="block text-xs font-semibold text-emerald-600 mb-1">รูปภาพหลังแก้ไขเสร็จ:</span>
                            <img src="${issue.resolveImage}" class="w-full h-48 object-cover rounded-2xl border border-emerald-300" alt="Resolved photo" />
                        </div>
                        ` : ''}
                    </div>

                    <div class="flex flex-wrap items-center justify-between gap-2 bg-slate-50 p-3 rounded-2xl border border-slate-200 text-xs mt-3">
                        <div class="flex items-center gap-1.5 text-slate-600 font-medium">
                            <i class="ph-bold ph-map-pin text-ku text-lg"></i>
                            <span>พิกัด: ${issue.lat.toFixed(5)}, ${issue.lng.toFixed(5)}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="focusOnDashboardMap(${issue.lat}, ${issue.lng})" class="px-2.5 py-1.5 rounded-lg bg-ku-light text-ku font-bold hover:bg-ku hover:text-white transition-all flex items-center gap-1">
                                <i class="ph-bold ph-crosshair"></i> ซูมในระบบ
                            </button>
                            <a href="https://www.google.com/maps?q=${issue.lat},${issue.lng}" target="_blank" class="px-2.5 py-1.5 rounded-lg bg-sky-50 text-sky-600 font-bold border border-sky-200 hover:bg-sky-500 hover:text-white transition-all flex items-center gap-1">
                                <i class="ph-bold ph-arrow-square-out"></i> Google Maps
                            </a>
                        </div>
                    </div>
                </div>
            `;

            if (issue.status === 'pending') {
                modalFooter.innerHTML = `
                    <div class="flex gap-2">
                        <button onclick="changeStatus('${issue.id}', 'progress')" class="flex-1 bg-sky-500 hover:bg-sky-600 text-white py-3 rounded-xl font-bold text-sm shadow-sm flex items-center justify-center gap-2 transition-all">
                            <i class="ph-bold ph-wrench text-lg"></i> รับเรื่องดำเนินการ
                        </button>
                    </div>
                `;
            } else if (issue.status === 'progress') {
                modalFooter.innerHTML = `
                    <div class="flex gap-2">
                        <button onclick="triggerResolveUpload('${issue.id}')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold text-sm shadow-sm flex items-center justify-center gap-2 transition-all">
                            <i class="ph-bold ph-camera text-lg"></i> ถ่ายรูปปิดงาน (แก้ไขแล้ว)
                        </button>
                    </div>
                `;
            } else {
                modalFooter.innerHTML = `
                    <div class="text-center text-xs text-emerald-600 font-bold flex items-center justify-center gap-1.5 py-1">
                        <i class="ph-fill ph-check-circle text-lg"></i> ปัญหานี้ได้รับการแก้ไขเรียบร้อยแล้ว
                    </div>
                `;
            }

            const modal = document.getElementById('issue-modal');
            const content = document.getElementById('issue-modal-content');
            modal.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('-translate-y-full');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('issue-modal');
            const content = document.getElementById('issue-modal-content');
            content.classList.add('-translate-y-full');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        async function changeStatus(id, newStatus) {
            try {
                await db.collection("issues").doc(id).update({ status: newStatus });
                showToast('อัปเดตสถานะใน Firestore เรียบร้อย', 'success');
                openModal(id);
            } catch (err) {
                console.error("Update status error:", err);
                showToast('ไม่สามารถอัปเดตสถานะได้', 'error');
            }
        }

        function triggerResolveUpload(id) {
            currentResolvingIssueId = id;
            document.getElementById('resolve-image-upload').click();
        }
    </script>
</body>
</html>
